<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Mate</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      color: #4f46e5;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      box-sizing: border-box;
    }

    input {
      width: 100%;
    }

    button {
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    .record {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .edit-button {
      background: #16a34a;
    }

    .delete-button {
      background: #e5484d;
      margin-left: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Study Mate</h1>
    <p>나의 공부 시간을 기록하고 확인해 보세요.</p>

    <div class="card">
      <h2>공부 기록 추가</h2>

      <form id="studyForm">
        <label>날짜</label>
        <input type="date" id="date" required>

        <label>공부 시간</label>
        <input
          type="number"
          id="value"
          min="0"
          step="0.5"
          placeholder="공부 시간(시간)"
          required
        >

        <label>메모</label>
        <input type="text" id="memo" placeholder="공부한 내용">

        <button type="submit">기록 추가</button>
      </form>
    </div>

    <div class="card">
      <h2>공부 요약</h2>
      <p id="summary">불러오는 중...</p>
    </div>

    <div class="card">
      <h2>공부 기록</h2>
      <div id="records">불러오는 중...</div>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000";

    async function loadData() {
      const response = await fetch(`${API_URL}/api/data`);
      const data = await response.json();

      const records = document.getElementById("records");
      records.innerHTML = "";

      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "record";

        const info = document.createElement("p");
        info.textContent =
          `${item.date} | ${item.value}시간 | ${item.memo}`;

        const editButton = document.createElement("button");
        editButton.textContent = "수정";
        editButton.className = "edit-button";
        editButton.onclick = () => editData(item);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "삭제";
        deleteButton.className = "delete-button";
        deleteButton.onclick = () => deleteData(item.id);

        div.appendChild(info);
        div.appendChild(editButton);
        div.appendChild(deleteButton);
        records.appendChild(div);
      });

      if (data.length === 0) {
        records.textContent = "등록된 공부 기록이 없습니다.";
      }

      loadSummary();
    }

    async function loadSummary() {
      const response = await fetch(`${API_URL}/api/data/summary`);
      const data = await response.json();

      document.getElementById("summary").textContent =
        `기록 ${data.count}개 | 총 ${data.total}시간 | 평균 ${data.average}시간`;
    }

    document.getElementById("studyForm").addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();

        const studyData = {
          date: document.getElementById("date").value,
          value: Number(document.getElementById("value").value),
          memo: document.getElementById("memo").value
        };

        const response = await fetch(`${API_URL}/api/data`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(studyData)
        });

        if (response.ok) {
          alert("공부 기록이 추가되었습니다.");
          document.getElementById("studyForm").reset();
          document.getElementById("date").value =
            new Date().toISOString().slice(0, 10);
          loadData();
        } else {
          alert("기록 추가에 실패했습니다.");
        }
      }
    );

    async function editData(item) {
      const newDate = prompt("날짜를 입력하세요.", item.date);
      if (newDate === null) return;

      const newValue = prompt("공부 시간을 입력하세요.", item.value);
      if (newValue === null) return;

      const newMemo = prompt("메모를 입력하세요.", item.memo);
      if (newMemo === null) return;

      if (newDate.trim() === "" || newValue.trim() === "") {
        alert("날짜와 공부 시간을 입력해주세요.");
        return;
      }

      const studyData = {
        date: newDate,
        value: Number(newValue),
        memo: newMemo
      };

      const response = await fetch(`${API_URL}/api/data/${item.id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(studyData)
      });

      if (response.ok) {
        alert("공부 기록이 수정되었습니다.");
        loadData();
      } else {
        alert("수정에 실패했습니다.");
      }
    }

    async function deleteData(id) {
      const confirmed = confirm("이 기록을 삭제할까요?");
      if (!confirmed) return;

      const response = await fetch(`${API_URL}/api/data/${id}`, {
        method: "DELETE"
      });

      if (response.ok) {
        alert("공부 기록이 삭제되었습니다.");
        loadData();
      } else {
        alert("삭제에 실패했습니다.");
      }
    }

    document.getElementById("date").value =
      new Date().toISOString().slice(0, 10);

    loadData();
  </script>
</body>
</html>
